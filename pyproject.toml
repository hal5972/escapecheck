[project]
name = "escapecheck"
version = "0.1.0"
description = "逃げ道の点検屋（EscapeCheck）: 民生委員が音声入力で作成する個別避難計画を、Claude が厳しい条件で点検し、改善案を示す"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk==0.2.179",
    "mcp==2.3.0",
]

[tool.uv]
# PC にインストール済みの python.org の Python だけを使う（uv に Python をダウンロードさせない）
python-preference = "only-system"
python-downloads = "never"
# パッケージとしては配布しない（アプリケーションとして実行する）
package = false
