<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>逃げ道の点検屋</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="print.css" media="print">
</head>
<body>
  <!-- タイムラインと一覧で使う模様。色だけで区別しないため、区間ごとに模様を変える -->
  <svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
    <defs>
      <pattern id="ec-pat-leave" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" fill="#d4e2f7"/><circle cx="5" cy="5" r="2" fill="#0a3a80"/>
      </pattern>
      <pattern id="ec-pat-walk" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" fill="#2f6fd0"/>
      </pattern>
      <pattern id="ec-pat-climb" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="10" height="10" fill="#d4e2f7"/><rect width="5" height="10" fill="#0a3a80"/>
      </pattern>
      <pattern id="ec-pat-help" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" fill="#eadff5"/><rect width="4" height="10" fill="#5a2a86"/>
      </pattern>
      <pattern id="ec-pat-travel" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" fill="#d3efec"/><rect width="10" height="4" fill="#0b5f5a"/>
      </pattern>
      <pattern id="ec-pat-short" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="12" height="12" fill="#fde8e6"/><rect width="12" height="4" fill="#b3261e"/><rect width="4" height="12" fill="#b3261e"/>
      </pattern>
      <pattern id="ec-pat-margin" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" fill="#bfe6c9"/>
      </pattern>
      <pattern id="ec-pat-tight" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
        <rect width="10" height="10" fill="#ffe39b"/><rect width="10" height="3" fill="#8a5a00"/>
      </pattern>
    </defs>
  </svg>

  <div class="app" id="app">
    <header class="topbar" id="topbar">
      <button type="button" class="btn-back" id="btn-back">← 戻る</button>
      <span class="topbar-spacer"></span>
      <button type="button" class="btn-voice-stop" id="btn-voice-stop" hidden>読み上げを止める</button>
    </header>
    <div class="banner" id="banner" role="note" hidden></div>
    <main class="main" id="main" tabindex="-1"></main>
    <div class="actions" id="actions"></div>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <div class="visually-hidden" id="live" role="status" aria-live="polite"></div>
  <noscript><p>このページを使うには、JavaScript を有効にしてください。</p></noscript>

  <script src="labels.js"></script>
  <script src="util.js"></script>
  <script src="store.js"></script>
  <script src="speech.js"></script>
  <script src="map.js"></script>
  <script src="timeline.js"></script>
  <script src="ui.js"></script>
  <script src="mock-api.js"></script>
  <script src="api.js"></script>
  <script src="shell.js"></script>
  <script src="print.js"></script>
  <script src="screens-home.js"></script>
  <script src="screens-talk.js"></script>
  <script src="screens-check.js"></script>
  <script src="screens-finish.js"></script>
  <script src="app.js"></script>
</body>
</html>
