<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>はじめに｜逃げ道の点検屋</title>
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <link rel="stylesheet" href="player.css">
  <link rel="stylesheet" href="intro.css">
</head>
<body>
<main class="player">
  <h1 class="visually-hidden">はじめに（約30秒のアニメーション）</h1>

  <div class="frame">
    <svg class="stage" viewBox="0 0 1920 1080" role="img"
         aria-label="高知県土佐市の宇佐の海辺の町、津波が来るまでの時計、紙の様式とハザードマップを前に悩む民生委員、スマートフォンの「話す」ボタンのイラスト">
      <defs>
        <linearGradient id="g-sky-day" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#86c9ec"/><stop offset="1" stop-color="#eaf6fb"/>
        </linearGradient>
        <linearGradient id="g-sky-night" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#050e22"/><stop offset="1" stop-color="#1d3d70"/>
        </linearGradient>
        <linearGradient id="g-sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7cc4e6"/><stop offset="1" stop-color="#2c7db3"/>
        </linearGradient>
        <radialGradient id="g-sun">
          <stop offset="0" stop-color="#fff6c4" stop-opacity="1"/><stop offset="1" stop-color="#fff6c4" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="g-band" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0e2b52" stop-opacity="0"/><stop offset="0.35" stop-color="#0e2b52" stop-opacity="0.9"/><stop offset="1" stop-color="#0e2b52"/>
        </linearGradient>
        <linearGradient id="g-dusk" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6a6aa8"/><stop offset="0.55" stop-color="#e9a077"/><stop offset="1" stop-color="#f7d08e"/>
        </linearGradient>
        <radialGradient id="g-glow">
          <stop offset="0" stop-color="#ffd36a" stop-opacity="0.6"/><stop offset="1" stop-color="#ffd36a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="g-paper" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6f4ee"/><stop offset="1" stop-color="#e3ecf8"/>
        </linearGradient>
        <pattern id="p-wave" width="160" height="24" patternUnits="userSpaceOnUse">
          <path d="M0 12 q20 -10 40 0 t40 0 t40 0 t40 0" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
        </pattern>

        <!-- 海の形（水平線から海岸線まで）。津波の波は、この形の中だけに描く -->
        <path id="sea-shape" d="M-40 455 H1960 V560 C1500 590 1100 630 800 650 C520 668 300 700 -40 716 Z"/>
        <clipPath id="clip-sea"><use href="#sea-shape"/></clipPath>

        <!-- 家（棟が横向き）。奥行きは右上へ向かう斜めの図 -->
        <symbol id="house-a" viewBox="0 0 160 130">
          <polygon class="wall-s" points="110,56 150,36 150,98 110,118"/>
          <polygon class="wall-g" points="110,56 150,36 130,10"/>
          <rect class="wall-f" x="10" y="56" width="100" height="62"/>
          <polygon class="roof" points="0,64 118,64 134,10 28,10"/>
          <rect class="eave" x="0" y="64" width="118" height="6"/>
          <rect class="door" x="22" y="80" width="20" height="38"/>
          <rect class="win" x="58" y="78" width="22" height="22"/>
          <rect class="win" x="88" y="78" width="16" height="22"/>
        </symbol>
        <!-- 家（棟が奥へ向かう） -->
        <symbol id="house-b" viewBox="0 0 160 130">
          <polygon class="wall-s" points="100,72 140,52 140,108 100,126"/>
          <polygon class="roof-s" points="52,22 96,2 150,52 100,74"/>
          <polygon class="wall-f" points="10,126 10,72 55,26 100,72 100,126"/>
          <polygon class="roof" points="0,76 55,18 110,76 100,76 55,30 10,76"/>
          <rect class="door" x="24" y="92" width="18" height="34"/>
          <rect class="win" x="58" y="88" width="24" height="22"/>
          <rect class="win" x="44" y="56" width="22" height="14"/>
        </symbol>
        <!-- 3階建てのビル -->
        <symbol id="block" viewBox="0 0 160 160">
          <polygon class="wall-s" points="104,46 144,26 144,134 104,154"/>
          <polygon class="wall-g" points="14,46 104,46 144,26 54,26"/>
          <rect class="wall-f" x="14" y="46" width="90" height="108"/>
          <rect class="win" x="26" y="60" width="20" height="20"/><rect class="win" x="56" y="60" width="20" height="20"/><rect class="win" x="82" y="60" width="14" height="20"/>
          <rect class="win" x="26" y="94" width="20" height="20"/><rect class="win" x="56" y="94" width="20" height="20"/><rect class="win" x="82" y="94" width="14" height="20"/>
          <rect class="door" x="34" y="128" width="26" height="26"/>
          <rect class="win" x="70" y="130" width="26" height="14"/>
        </symbol>
        <symbol id="tree" viewBox="0 0 60 80">
          <rect x="27" y="50" width="7" height="30" fill="#7a5a3a"/>
          <circle cx="30" cy="26" r="22" fill="#3f8a4c"/><circle cx="18" cy="38" r="16" fill="#4c9b58"/><circle cx="42" cy="38" r="16" fill="#46924f"/>
        </symbol>
        <symbol id="pine" viewBox="0 0 50 90">
          <rect x="22" y="62" width="6" height="28" fill="#6d4f35"/>
          <polygon points="25,4 46,34 4,34" fill="#2f7a47"/><polygon points="25,20 48,52 2,52" fill="#2a7040"/><polygon points="25,36 50,70 0,70" fill="#256839"/>
        </symbol>
        <symbol id="boat" viewBox="0 0 120 56">
          <ellipse cx="60" cy="50" rx="52" ry="5" fill="#0d3a5e" fill-opacity="0.25"/>
          <polygon points="6,26 114,26 98,46 22,46" fill="#f8f8f4"/>
          <polygon points="10,32 110,32 106,38 14,38" fill="#1d6aa8"/>
          <rect x="46" y="8" width="34" height="18" fill="#e5ecf0"/><rect x="52" y="12" width="22" height="9" fill="#9ccbe4"/>
          <rect x="30" y="0" width="3" height="26" fill="#6b747c"/>
        </symbol>
        <symbol id="cloud" viewBox="0 0 300 100">
          <ellipse cx="110" cy="64" rx="86" ry="30" fill="#fff"/><ellipse cx="196" cy="60" rx="72" ry="34" fill="#fff"/><ellipse cx="150" cy="42" rx="62" ry="34" fill="#fff"/>
        </symbol>
      </defs>

      <!-- ===== ① 宇佐の海辺の町（②でゆれる。④で夜になる） ===== -->
      <g id="town-shake">
        <g id="town">
          <rect x="-60" y="-60" width="2040" height="640" fill="url(#g-sky-day)"/>
          <rect id="sky-night" x="-60" y="-60" width="2040" height="640" fill="url(#g-sky-night)"/>

          <g id="sun">
            <circle cx="1560" cy="176" r="150" fill="url(#g-sun)"/>
            <circle cx="1560" cy="176" r="70" fill="#fff3b0"/>
          </g>
          <g id="clouds">
            <use class="cloud c1" href="#cloud" x="260" y="120" width="330" height="110" opacity="0.95"/>
            <use class="cloud c2" href="#cloud" x="900" y="70" width="270" height="90" opacity="0.9"/>
            <use class="cloud c3" href="#cloud" x="1330" y="290" width="230" height="76" opacity="0.8"/>
          </g>

          <path id="far-hills" d="M-60 468 C140 392 330 410 520 446 C720 482 880 372 1100 388 C1380 408 1560 336 1980 410 V470 H-60 Z" fill="#b5d3dc"/>
          <use href="#sea-shape" fill="url(#g-sea)"/>
          <g clip-path="url(#clip-sea)">
            <rect class="wave-row w1" x="-220" y="490" width="2400" height="24" fill="url(#p-wave)"/>
            <rect class="wave-row w2" x="-220" y="540" width="2400" height="24" fill="url(#p-wave)"/>
            <rect class="wave-row w3" x="-220" y="592" width="2400" height="24" fill="url(#p-wave)"/>
            <rect class="wave-row w4" x="-220" y="646" width="2400" height="24" fill="url(#p-wave)"/>
          </g>

          <!-- 津波の波（②）。海の中だけに描き、海岸線で止める -->
          <g clip-path="url(#clip-sea)">
            <g id="wave">
              <rect x="-60" y="456" width="2040" height="150" fill="#1d5d92" fill-opacity="0.9"/>
              <path d="M-60 520 q50 -22 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0" fill="none" stroke="#bfe3f5" stroke-width="7" stroke-opacity="0.7"/>
              <path d="M-40 470 q40 -40 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
            </g>
          </g>

          <path id="mid-hills" d="M780 600 C930 500 1110 336 1380 330 C1620 326 1790 410 1980 388 V620 H780 Z" fill="#79ad86"/>
          <path d="M1180 360 C1300 330 1500 326 1620 350 C1500 380 1340 400 1180 360 Z" fill="#6aa079" opacity="0.7"/>
          <use href="#pine" x="1060" y="420" width="42" height="76"/><use href="#pine" x="1108" y="408" width="46" height="82"/>
          <use href="#pine" x="1500" y="372" width="40" height="72"/><use href="#pine" x="1548" y="384" width="44" height="78"/>
          <use href="#pine" x="1690" y="396" width="40" height="72"/>

          <!-- 海岸線の砂浜と陸地 -->
          <path d="M-40 716 C300 700 520 668 800 650 C1100 630 1500 590 1960 560" fill="none" stroke="#f1e3ba" stroke-width="30"/>
          <path id="land" d="M-40 716 C300 700 520 668 800 650 C1100 630 1500 590 1960 560 V1100 H-40 Z" fill="#a6cf8e"/>
          <path d="M-40 716 C300 700 520 668 800 650 C1100 630 1500 590 1960 560" fill="none" stroke="#fff" stroke-width="7" stroke-opacity="0.8" stroke-dasharray="40 26"/>
          <path d="M-60 868 C380 836 900 794 1400 752 C1620 734 1800 714 1980 696 V744 C1800 764 1620 782 1400 800 C900 842 380 886 -60 920 Z" fill="#c4bfb3"/>

          <!-- 防波堤と灯台 -->
          <polygon points="532,680 592,680 606,560 568,560" fill="#cfd4d8"/>
          <polygon points="592,680 606,560 614,566 602,684" fill="#9aa3aa"/>
          <polygon points="578,560 596,560 592,506 582,506" fill="#fff"/><polygon points="581,538 593,538 592,522 582,522" fill="#c93a2e"/>
          <rect x="580" y="496" width="14" height="10" fill="#ffd45e"/><polygon points="576,496 598,496 587,484" fill="#c93a2e"/>

          <!-- 家と木（奥の列から手前の列へ） -->
          <use class="hv1" href="#house-a" x="990" y="640" width="99" height="80"/>
          <use class="hv2" href="#house-b" x="1126" y="634" width="99" height="80"/>
          <use class="hv3" href="#block" x="1262" y="568" width="104" height="104"/>
          <use class="hv4" href="#house-a" x="1424" y="612" width="99" height="80"/>
          <use class="hv1" href="#house-b" x="1566" y="604" width="99" height="80"/>
          <use class="hv2" href="#house-a" x="1716" y="588" width="99" height="80"/>
          <use href="#tree" x="1100" y="650" width="34" height="46"/><use href="#tree" x="1530" y="620" width="34" height="46"/>

          <use class="hv3" href="#house-a" x="690" y="708" width="131" height="106"/>
          <use class="hv4" href="#house-b" x="880" y="706" width="131" height="106"/>
          <use class="hv1" href="#house-a" x="1150" y="690" width="131" height="106"/>
          <use class="hv2" href="#house-b" x="1380" y="672" width="131" height="106"/>
          <use class="hv3" href="#house-a" x="1620" y="652" width="131" height="106"/>
          <use href="#tree" x="1040" y="716" width="42" height="56"/><use href="#tree" x="1330" y="700" width="42" height="56"/><use href="#tree" x="1780" y="680" width="44" height="58"/>

          <use class="hv2" href="#house-a" x="290" y="756" width="168" height="136"/>
          <use class="hv1" href="#house-b" x="560" y="770" width="168" height="136"/>
          <use class="hv4" href="#house-a" x="860" y="778" width="168" height="136"/>
          <use class="hv3" href="#house-b" x="1170" y="764" width="168" height="136"/>
          <use class="hv1" href="#house-a" x="1470" y="744" width="168" height="136"/>
          <use class="hv2" href="#house-b" x="1730" y="728" width="168" height="136"/>
          <use href="#tree" x="470" y="800" width="52" height="70"/><use href="#tree" x="1070" y="816" width="52" height="70"/><use href="#tree" x="1380" y="796" width="52" height="70"/>

          <!-- 漁港の船 -->
          <use class="boat b1" href="#boat" x="230" y="604" width="120" height="56"/>
          <use class="boat b2" href="#boat" x="410" y="566" width="96" height="45"/>
          <use class="boat b3" href="#boat" x="120" y="560" width="84" height="40"/>

          <rect id="dim" x="-60" y="-60" width="2040" height="1200" fill="#1b2a44"/>
          <rect id="night" x="-60" y="-60" width="2040" height="1200" fill="#06132c"/>

          <!-- ④ 夜の星・月・月明かり・明かりの窓（暗くする覆いの上に置く） -->
          <g id="stars">
            <g class="tw1" fill="#fff"><circle cx="120" cy="60" r="3"/><circle cx="380" cy="110" r="2.5"/><circle cx="560" cy="40" r="3"/><circle cx="800" cy="90" r="2.5"/><circle cx="1040" cy="170" r="3"/><circle cx="1280" cy="210" r="2.5"/><circle cx="1500" cy="260" r="3"/><circle cx="1760" cy="190" r="2.5"/><circle cx="60" cy="200" r="2.5"/><circle cx="1000" cy="380" r="2"/></g>
            <g class="tw2" fill="#fff"><circle cx="240" cy="300" r="2.5"/><circle cx="470" cy="250" r="3"/><circle cx="720" cy="330" r="2"/><circle cx="960" cy="50" r="3"/><circle cx="1200" cy="80" r="2.5"/><circle cx="1440" cy="60" r="3"/><circle cx="1680" cy="320" r="2.5"/><circle cx="1840" cy="70" r="3"/><circle cx="330" cy="380" r="2"/></g>
            <g class="tw3" fill="#fff"><circle cx="640" cy="190" r="2.5"/><circle cx="880" cy="230" r="3"/><circle cx="1120" cy="300" r="2.5"/><circle cx="1360" cy="350" r="2"/><circle cx="1600" cy="120" r="3"/><circle cx="180" cy="380" r="2.5"/><circle cx="1560" cy="380" r="2"/></g>
          </g>
          <g id="moon">
            <circle cx="260" cy="170" r="130" fill="url(#g-sun)"/>
            <circle cx="260" cy="170" r="62" fill="#fff6cf"/>
            <circle cx="240" cy="154" r="12" fill="#eadfae" fill-opacity="0.7"/><circle cx="282" cy="188" r="16" fill="#eadfae" fill-opacity="0.6"/><circle cx="268" cy="140" r="8" fill="#eadfae" fill-opacity="0.6"/>
          </g>
          <g id="moon-reflect" fill="#fff6cf" fill-opacity="0.55">
            <rect x="196" y="486" width="128" height="8" rx="4"/><rect x="214" y="510" width="92" height="8" rx="4"/><rect x="200" y="534" width="120" height="8" rx="4"/><rect x="224" y="558" width="72" height="8" rx="4"/><rect x="208" y="582" width="104" height="8" rx="4"/>
          </g>
          <g id="lights">
            <g class="lit-g l1"><circle cx="362.5" cy="849.5" r="26" fill="url(#g-glow)"/><rect x="351" y="838" width="23" height="23" rx="2" fill="#ffd36a"/><circle cx="932.5" cy="871.5" r="26" fill="url(#g-glow)"/><rect x="921" y="860" width="23" height="23" rx="2" fill="#ffd36a"/><circle cx="1542.5" cy="837.5" r="26" fill="url(#g-glow)"/><rect x="1531" y="826" width="23" height="23" rx="2" fill="#ffd36a"/><circle cx="633.5" cy="873.5" r="26" fill="url(#g-glow)"/><rect x="621" y="862" width="25" height="23" rx="2" fill="#ffd36a"/><circle cx="1243.5" cy="867.5" r="26" fill="url(#g-glow)"/><rect x="1231" y="856" width="25" height="23" rx="2" fill="#ffd36a"/><circle cx="1803.5" cy="831.5" r="26" fill="url(#g-glow)"/><rect x="1791" y="820" width="25" height="23" rx="2" fill="#ffd36a"/></g>
            <g class="lit-g l2"><circle cx="390.5" cy="849.5" r="26" fill="url(#g-glow)"/><rect x="382" y="838" width="17" height="23" rx="2" fill="#ffd36a"/><circle cx="746" cy="781" r="26" fill="url(#g-glow)"/><rect x="737" y="772" width="18" height="18" rx="2" fill="#ffd36a"/><circle cx="1206" cy="763" r="26" fill="url(#g-glow)"/><rect x="1197" y="754" width="18" height="18" rx="2" fill="#ffd36a"/><circle cx="1676" cy="725" r="26" fill="url(#g-glow)"/><rect x="1667" y="716" width="18" height="18" rx="2" fill="#ffd36a"/><circle cx="937" cy="787" r="26" fill="url(#g-glow)"/><rect x="927" y="778" width="20" height="18" rx="2" fill="#ffd36a"/><circle cx="1437" cy="753" r="26" fill="url(#g-glow)"/><rect x="1427" y="744" width="20" height="18" rx="2" fill="#ffd36a"/></g>
            <g class="lit-g l3"><circle cx="1033" cy="695" r="26" fill="url(#g-glow)"/><rect x="1026" y="688" width="14" height="14" rx="2" fill="#ffd36a"/><circle cx="1467" cy="667" r="26" fill="url(#g-glow)"/><rect x="1460" y="660" width="14" height="14" rx="2" fill="#ffd36a"/></g>
          </g>
        </g>
      </g>

      <!-- ===== ② 地震の表示と、津波が来るまでの時計 ===== -->
      <g id="quake-tag">
        <rect x="760" y="340" width="400" height="104" rx="22" fill="#b3261e"/>
        <text x="960" y="412" text-anchor="middle" font-size="64" fill="#fff">地震が起きた</text>
      </g>

      <g id="clock-ui" transform="translate(1560 360)">
        <g id="clock-face">
          <circle r="176" fill="#fff" fill-opacity="0.35"/>
          <circle r="150" fill="#fff" stroke="#0e2b52" stroke-width="10"/>
          <circle id="sector" r="72" fill="none" stroke="#d3342b" stroke-width="144" pathLength="360" transform="rotate(-90)"/>
          <g stroke="#0e2b52" stroke-width="7" stroke-linecap="round">
            <line y1="-140" y2="-122"/><line y1="-140" y2="-122" transform="rotate(30)"/><line y1="-140" y2="-122" transform="rotate(60)"/>
            <line y1="-140" y2="-122" transform="rotate(90)"/><line y1="-140" y2="-122" transform="rotate(120)"/><line y1="-140" y2="-122" transform="rotate(150)"/>
            <line y1="-140" y2="-122" transform="rotate(180)"/><line y1="-140" y2="-122" transform="rotate(210)"/><line y1="-140" y2="-122" transform="rotate(240)"/>
            <line y1="-140" y2="-122" transform="rotate(270)"/><line y1="-140" y2="-122" transform="rotate(300)"/><line y1="-140" y2="-122" transform="rotate(330)"/>
          </g>
          <line id="hand" y2="-128" stroke="#0e2b52" stroke-width="11" stroke-linecap="round"/>
          <circle r="15" fill="#0e2b52"/>
        </g>
        <g id="clock-label">
          <rect x="-190" y="196" width="380" height="76" rx="18" fill="#fff"/>
          <text y="250" text-anchor="middle" font-size="46" fill="#0e2b52">津波が来るまで</text>
        </g>
      </g>

      <!-- ===== ③ 紙の様式とハザードマップを前に悩む民生委員（顔は描かない） ===== -->
      <g id="room">
        <rect x="-40" y="-40" width="2000" height="580" fill="#f1e6d1"/>
        <rect x="-40" y="496" width="2000" height="36" fill="#e3d3b4"/>

        <!-- 窓（夕方） -->
        <rect x="1400" y="110" width="440" height="330" fill="#7c5c3f"/>
        <rect x="1418" y="128" width="404" height="294" fill="url(#g-dusk)"/>
        <path d="M1418 380 C1500 330 1580 350 1650 320 C1720 292 1780 330 1822 316 V422 H1418 Z" fill="#4a4a7c"/>
        <path d="M1418 396 H1822 V422 H1418 Z" fill="#35507e"/>
        <rect x="1612" y="128" width="16" height="294" fill="#7c5c3f"/>
        <rect x="1418" y="268" width="404" height="14" fill="#7c5c3f"/>
        <rect x="1384" y="438" width="472" height="22" fill="#96734f"/>

        <!-- 人（机の向こう側。顔は描かない） -->
        <g transform="translate(550 0)">
        <path d="M730 560 C730 490 786 456 850 452 L950 452 C1014 456 1070 490 1070 560 Z" fill="#6a8fb0"/>
        <polygon points="868,452 932,452 900,512" fill="#f4efe6"/>
        <rect x="884" y="408" width="32" height="48" fill="#f0c7a0"/>
        <g id="head">
          <ellipse cx="832" cy="356" rx="9" ry="14" fill="#e5b58f"/><ellipse cx="968" cy="356" rx="9" ry="14" fill="#e5b58f"/>
          <ellipse cx="900" cy="348" rx="66" ry="76" fill="#f0c7a0"/>
          <path d="M833 346 C826 272 868 258 900 258 C934 258 976 272 967 346 C960 312 932 298 900 298 C868 298 840 312 833 346 Z" fill="#cfd3d8"/>
          <circle cx="900" cy="246" r="27" fill="#cfd3d8"/><rect x="880" y="268" width="40" height="8" rx="4" fill="#9aa1aa"/>
        </g>

        </g>

        <!-- 机 -->
        <polygon points="160,520 1760,520 1940,900 -20,900" fill="#d8b083"/>
        <g stroke="#c89f70" stroke-width="3" stroke-opacity="0.7" fill="none">
