<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>frame</title>
<style>html,body{margin:0;background:#dde3ee}iframe{display:block;margin:0 auto;border:0;background:#fff}</style></head>
<body><iframe id="f" width="390"></iframe>
<script>
// 試験・撮影用: 画面を、スマートフォンの幅（w）と高さ（h）の枠に入れて開く。p は、開く画面（#/ のあと）。
// do は、開いたあとに作る状態（listening: 聞き取り中、dialog: 確認の表示、error: 失敗の表示、running: 点検の実行中）。
// measure=1 は、画面の全体の高さ（上の帯・段階の表示・下のボタンを含む）を、body の data-h に入れる（h を小さくして開く）
const q=new URLSearchParams(location.search);
const f=document.getElementById('f');
f.width=q.get('w')||'390';
f.height=q.get('h')||'844';
f.src='/?mock=1&autologin=1'+(q.get('x')||'')+'#'+(q.get('p')||'/home');

const acts={
  listening(w){
    const main=w.document.getElementById('main');
    const badge=main.querySelector('.live-badge'); const tr=main.querySelector('.transcript');
    if(!badge||!tr) return;
    badge.hidden=false; tr.classList.add('is-live');
    tr.textContent='山田さんは一人暮らしで、杖ついちゅう。';
    const s=w.document.createElement('span'); s.className='interim'; s.textContent='夜は1階の奥の部屋で'; tr.appendChild(s);
    w.EC.app.setActions([{id:'talk',kind:'primary',label:'止める',listening:true,onClick(){}},{id:'ok',label:'それでいい',trailing:'chevron-right',disabled:true,onClick(){}}]);
    badge.scrollIntoView({block:'nearest'}); main.scrollTop+=8;
  },
  dialog(w){ w.EC.ui.confirmDialog({title:'計画の削除',danger:true,message:'山田さんの計画を、この端末から消します。元には戻せません。',okLabel:'消す',cancelLabel:'やめる'}); },
  error(w){
    const A=w.EC.app; const main=A.$main;
    const slot=main.querySelector('.status-slot'); if(slot) slot.append(A.errorBox('音声入力を使えませんでした。文字で入力してください。'));
    const tw=main.querySelector('.typed-wrap'); if(tw){ tw.hidden=false; tw.scrollIntoView({block:'nearest'}); }
  },
  running(w){ const b=w.document.getElementById('run'); if(b) b.click(); },
  // 確認の画面: 1 件めを済ませて、2 件めを出す／すべて済ませて、完成の表示にする
  verify2(w){ const t=w.setInterval(()=>{ const b=w.document.getElementById('consult'); if(b&&!b.disabled){ w.clearInterval(t); b.click(); } },500); },
  verifyDone(w){
    const t=w.setInterval(()=>{
      const d=w.document; if(d.getElementById('print')){ w.clearInterval(t); return; }
      const b=d.getElementById('consult')||d.getElementById('skip'); if(b&&!b.disabled) b.click();
    },900);
  },
  // 保存した計画があるホーム
  savedHome(w){ w.EC.mock.samples.build('yamada','talked').then((rec)=>{ w.EC.app.openRecord(rec); w.EC.app.go('home'); }); },
};
const act=q.get('do');
if(act&&acts[act]) f.addEventListener('load',()=>setTimeout(()=>{ try{ acts[act](f.contentWindow); }catch(e){} }, Number(q.get('wait')||2000)));
if(q.get('measure')) f.addEventListener('load',()=>setTimeout(()=>{
  try{
    const m=f.contentDocument.getElementById('main');
    const chrome=f.contentWindow.innerHeight-m.clientHeight;
    document.body.setAttribute('data-h',String(m.scrollHeight+chrome));
  }catch(e){}
}, Number(q.get('fitwait')||6000)));
</script></body></html>
