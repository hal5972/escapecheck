<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>仕組み｜逃げ道の点検屋</title>
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <link rel="stylesheet" href="../intro/player.css">
  <link rel="stylesheet" href="story.css">
</head>
<body>
<main class="player">
  <h1 class="visually-hidden">仕組み（約10秒のアニメーション）</h1>

  <div class="frame">
    <svg class="stage" viewBox="0 0 1920 1080" role="img"
         aria-label="話を聞き取りエージェントが計画にし、レッドチームエージェントが弱点を探し、数値は計算ツールが出し、フックが根拠のない記載を止め、別のセッションの検証エージェントが確認し、人が承認して印刷する流れの図">
      <defs>
        <linearGradient id="g-paper" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6f4ee"/><stop offset="1" stop-color="#e3ecf8"/>
        </linearGradient>
        <linearGradient id="g-band" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0e2b52" stop-opacity="0"/><stop offset="0.35" stop-color="#0e2b52" stop-opacity="0.9"/><stop offset="1" stop-color="#0e2b52"/>
        </linearGradient>
      </defs>
      <rect x="-20" y="-20" width="1960" height="1120" fill="url(#g-paper)"/>

      <g id="flow">
          <g class="card c-a1"><rect x="60" y="270" width="400" height="250" rx="26" fill="#ffffff" stroke="#0e2b52" stroke-width="7"/><text x="88" y="350" font-size="44" fill="#0e2b52">話（土佐弁）</text><rect x="88" y="374" width="330" height="104" rx="22" fill="#e6eefa"/><polygon points="418,410 446,430 418,450" fill="#e6eefa"/><text x="253" y="446" text-anchor="middle" font-size="50" fill="#0e2b52">2階で寝ゆう</text></g>
          <g class="card c-a2"><rect x="530" y="270" width="400" height="250" rx="26" fill="#ffffff" stroke="#0a4a98" stroke-width="7"/><g transform="translate(558 294)" fill="none" stroke="#0a4a98" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="25" y="6" width="22" height="40" rx="11"/><path d="M14 36 a22 22 0 0 0 44 0"/><path d="M36 58 v10"/></g><text x="646" y="328" font-size="40" fill="#0e2b52">聞き取り</text><text x="646" y="374" font-size="40" fill="#0e2b52">エージェント</text></g>
          <g class="chip k-a2"><rect x="558" y="456" width="334" height="46" rx="10" fill="#e6eefa"/><text class="mono" x="572" y="489" font-size="30" fill="#0e2b52">claude-sonnet-5-5</text></g>
          <g class="card c-a3"><rect x="1000" y="270" width="400" height="250" rx="26" fill="#ffffff" stroke="#0e2b52" stroke-width="7"/><g transform="translate(1028 294)" fill="none" stroke="#0e2b52" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6 H46 L60 20 V66 H16 Z"/><path d="M46 6 V20 H60"/><path d="M26 36 H50 M26 48 H50 M26 58 H40"/></g><text x="1116" y="350" font-size="44" fill="#0e2b52">計画</text><text class="sub" x="1028" y="430" font-size="30" fill="#374151">出典表示つき</text></g>
          <g class="tag g1"><rect x="1028" y="456" width="120" height="44" rx="22" fill="#e6eefa" stroke="#0e2b52" stroke-width="3"/><text x="1088" y="487" text-anchor="middle" font-size="24" fill="#0e2b52">本人の話</text></g>
          <g class="tag g2"><rect x="1156" y="456" width="144" height="44" rx="22" fill="#e6eefa" stroke="#0e2b52" stroke-width="3"/><text x="1228" y="487" text-anchor="middle" font-size="24" fill="#0e2b52">国のデータ</text></g>
          <g class="tag g3"><rect x="1308" y="456" width="72" height="44" rx="22" fill="#e6eefa" stroke="#0e2b52" stroke-width="3"/><text x="1344" y="487" text-anchor="middle" font-size="24" fill="#0e2b52">仮定</text></g>
          <g class="card c-a4"><rect x="1470" y="270" width="400" height="250" rx="26" fill="#ffffff" stroke="#0a4a98" stroke-width="7"/><g transform="translate(1498 294)" fill="none" stroke="#0a4a98" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="30" r="20"/><path d="M45 45 L64 64"/></g><text x="1586" y="328" font-size="40" fill="#0e2b52">レッドチーム</text><text x="1586" y="374" font-size="40" fill="#0e2b52">エージェント</text><text class="sub" x="1498" y="430" font-size="30" fill="#374151">弱点を探す</text></g>
          <g class="chip k-a4"><rect x="1498" y="456" width="298" height="46" rx="10" fill="#e6eefa"/><text class="mono" x="1512" y="489" font-size="30" fill="#0e2b52">claude-opus-5-5</text></g>
          <g class="card c-t"><rect x="1470" y="30" width="400" height="170" rx="26" fill="#e8f5f2" stroke="#0b5f5a" stroke-width="7"/><g transform="translate(1498 54)" fill="none" stroke="#0b5f5a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="6" width="44" height="60" rx="6"/><rect x="22" y="14" width="28" height="12"/><path d="M24 38 h2 M36 38 h2 M48 38 h2 M24 48 h2 M36 48 h2 M48 48 h2 M24 58 h2 M36 58 h2 M48 58 h2"/></g><text x="1586" y="110" font-size="44" fill="#0e2b52">計算ツール</text><text class="sub" x="1498" y="176" font-size="30" fill="#374151">数値は、コードが出す</text><rect x="1786" y="44" width="68" height="34" rx="8" fill="#fff" stroke="#0b5f5a" stroke-width="3"/><text class="mono" x="1820" y="69" text-anchor="middle" font-size="24" fill="#0b5f5a">MCP</text></g>
          <g class="card c-b4"><rect x="1470" y="640" width="400" height="250" rx="26" fill="#e8f5f2" stroke="#0b5f5a" stroke-width="7"/><g transform="translate(1498 664)" fill="none" stroke="#0b5f5a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M36 6 L60 16 V36 C60 52 48 62 36 68 C24 62 12 52 12 36 V16 Z"/><path d="M26 28 L46 48 M46 28 L26 48"/></g><text x="1586" y="720" font-size="44" fill="#0e2b52">フック</text><text class="sub" x="1498" y="800" font-size="30" fill="#374151">原文に無い引用・</text><text class="sub" x="1498" y="840" font-size="30" fill="#374151">直接記載した数値を止める</text></g>
          <g class="card c-b3"><rect x="1000" y="640" width="400" height="250" rx="26" fill="#ffffff" stroke="#0a4a98" stroke-width="7"/><g transform="translate(1028 664)" fill="none" stroke="#0a4a98" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="36" r="28"/><path d="M22 37 L32 47 L51 26"/></g><text x="1116" y="698" font-size="40" fill="#0e2b52">検証</text><text x="1116" y="744" font-size="40" fill="#0e2b52">エージェント</text><text class="sub" x="1028" y="800" font-size="30" fill="#374151">別のセッション</text></g>
          <g class="chip k-b3"><rect x="1028" y="826" width="334" height="46" rx="10" fill="#e6eefa"/><text class="mono" x="1042" y="859" font-size="30" fill="#0e2b52">claude-sonnet-5-5</text></g>
          <g class="card c-b2"><rect x="530" y="640" width="400" height="250" rx="26" fill="#fff6dd" stroke="#8a5a00" stroke-width="7"/><g transform="translate(558 664)" fill="none" stroke="#8a5a00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="24" r="14"/><path d="M10 66 C10 46 22 40 36 40 C50 40 62 46 62 66"/></g><text x="646" y="720" font-size="44" fill="#0e2b52">人の承認</text><text class="sub" x="558" y="800" font-size="30" fill="#374151">民生委員と本人が決める</text></g>
          <g class="card c-b1"><rect x="60" y="640" width="400" height="250" rx="26" fill="#ffffff" stroke="#0e2b52" stroke-width="7"/><g transform="translate(88 664)" fill="none" stroke="#0e2b52" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 22 V8 H52 V22"/><rect x="8" y="22" width="56" height="30" rx="6"/><rect x="20" y="42" width="32" height="24"/></g><text x="176" y="720" font-size="44" fill="#0e2b52">印刷</text><text class="sub" x="88" y="800" font-size="30" fill="#374151">市の様式・避難カード</text></g>
          <g class="ar ar1" fill="none" stroke="#0e2b52" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="ar-line" d="M468 395 H514" pathLength="1"/><path class="ar-head" d="M498 379 L522 395 L498 411"/></g>
          <g class="ar ar2" fill="none" stroke="#0e2b52" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="ar-line" d="M938 395 H984" pathLength="1"/><path class="ar-head" d="M968 379 L992 395 L968 411"/></g>
          <g class="ar ar3" fill="none" stroke="#0e2b52" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="ar-line" d="M1408 395 H1454" pathLength="1"/><path class="ar-head" d="M1438 379 L1462 395 L1438 411"/></g>
          <g class="ar ar-t" fill="none" stroke="#0e2b52" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="ar-line" d="M1670 218 V252" pathLength="1"/><path class="ar-head" d="M1654 224 L1670 206 L1686 224 M1654 246 L1670 264 L1686 246"/></g>
          <g class="ar ar4" fill="none" stroke="#0e2b52" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="ar-line" d="M1670 530 V610" pathLength="1"/><path class="ar-head" d="M1654 610 L1670 634 L1686 610"/></g>
          <g class="ar ar5" fill="none" stroke="#0e2b52" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="ar-line" d="M1462 765 H1416" pathLength="1"/><path class="ar-head" d="M1432 749 L1408 765 L1432 781"/></g>
          <g class="ar ar6" fill="none" stroke="#0e2b52" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="ar-line" d="M992 765 H946" pathLength="1"/><path class="ar-head" d="M962 749 L938 765 L962 781"/></g>
          <g class="ar ar7" fill="none" stroke="#0e2b52" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="ar-line" d="M522 765 H476" pathLength="1"/><path class="ar-head" d="M492 749 L468 765 L492 781"/></g>
          <g transform="translate(1670 552)"><g class="reject"><rect x="-26" y="-34" width="52" height="68" rx="6" fill="#fff" stroke="#0e2b52" stroke-width="5"/><path d="M-14 -14 H14 M-14 0 H14 M-14 14 H4" stroke="#0e2b52" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="22" cy="28" r="18" fill="#b3261e"/><path d="M15 21 L29 35 M29 21 L15 35" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/></g></g>
          <g class="stop"><rect x="1716" y="660" width="132" height="50" rx="25" fill="#b3261e"/><text x="1782" y="696" text-anchor="middle" font-size="32" fill="#fff">止める</text></g>
      </g>

      <!-- 字幕を入れる下の帯（ここには何も置かない） -->
      <rect x="-20" y="880" width="1960" height="220" fill="url(#g-band)"/>
    </svg>
    <i class="clock" id="clock" aria-hidden="true"></i>

    <div class="caps">
      <p class="cap cap-s1">話を、出典つきの計画にします。</p>
      <p class="cap cap-s2">弱点を探し、数値は計算ツールが出します。</p>
      <p class="cap cap-s3">根拠のない記載は、フックが止めます。</p>
      <p class="cap cap-s4">別のセッションで確認し、人が承認します。</p>
    </div>
  </div>

  <div class="controls">
    <button type="button" class="btn" id="btn-main">一時停止</button>
    <button type="button" class="btn btn-sub" id="btn-sub">最初から</button>
    <span class="time" id="time" aria-hidden="true">0:00 / 0:00</span>
  </div>
</main>
<script src="../intro/player.js"></script>
</body>
</html>
