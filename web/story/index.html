<!doctype html>

          <stop offset="0" stop-color="#f2f4f8"/><stop offset="1" stop-color="#e3ebf8"/>

      </defs>
      <rect x="-20" y="-20" width="1960" height="1120" fill="url(#g-paper)"/>

      <g id="flow">

          <g class="card c-b2"><rect x="530" y="660" width="400" height="250" rx="26" fill="#e4f3e9" stroke="#1b7d46" stroke-width="7"/><g transform="translate(558 684)" fill="none" stroke="#1b7d46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="24" r="14"/><path d="M10 66 C10 46 22 40 36 40 C50 40 62 46 62 66"/></g><text x="646" y="740" font-size="44" fill="#13294f">人の承認</text><text class="sub" x="558" y="820" font-size="30" fill="#0c4423">民生委員と本人が決める</text></g>

          <g class="ar ar1" fill="none" stroke="#21478a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="ar-line" d="M468 455 H514" pathLength="1"/><path class="ar-head" d="M498 439 L522 455 L498 471"/></g>
          <g class="ar ar2" fill="none" stroke="#21478a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="ar-line" d="M938 455 H984" pathLength="1"/><path class="ar-head" d="M968 439 L992 455 L968 471"/></g>
          <g class="ar ar3" fill="none" stroke="#21478a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="ar-line" d="M1408 455 H1454" pathLength="1"/><path class="ar-head" d="M1438 439 L1462 455 L1438 471"/></g>
          <g class="ar ar-t" fill="none" stroke="#21478a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="ar-line" d="M1670 220 V310" pathLength="1"/><path class="ar-head" d="M1654 224 L1670 206 L1686 224 M1654 306 L1670 324 L1686 306"/></g>

          <g class="ar ar6" fill="none" stroke="#21478a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="ar-line" d="M992 785 H946" pathLength="1"/><path class="ar-head" d="M962 769 L938 785 L962 801"/></g>

      </g>

      <!-- 字幕を入れる下の帯（ここには何も置かない） -->
      <rect x="-20" y="880" width="1960" height="220" fill="url(#g-band)"/>
    </svg>
    <i class="clock" id="clock" aria-hidden="true"></i>

    <div class="caps">
      <p class="cap cap-s1">話を、出典つきの計画にします。</p>
      <p class="cap cap-s2">弱点を探し、数値は計算ツールが出します。</p>
      <p class="cap cap-s3">原文に無い引用と、直接記載した数値は、フックが止めます。</p>
      <p class="cap cap-s4">別のセッションで確認し、人が承認します。</p>
    </div>
  </div>

  <div class="controls">
    <button type="button" class="btn" id="btn-main">一時停止</button>
    <button type="button" class="btn btn-sub" id="btn-sub">最初から</button>
    <span class="time" id="time" aria-hidden="true">0:00 / 0:00</span>
  </div>
</main>
